name: security-scan

# Baseline security CI for Zero (SAST + secret scanning + dependency audit).
#
# Introduced by the supervise loop to close the recurring plan-grader gap
# ("Configure CI Security Scans" / "Enforce Secret Management in CI" /
# "Add SAST workflow" / "Add secret scanning to CI"): before this, the only
# workflow was golden-set-regression.yml — no SAST, no secret scan, no dep audit.
#
# Report-only on introduction: bandit + pip-audit run with continue-on-error so
# they surface findings without blocking a first push onto a repo that has never
# been scanned. gitleaks scans the working tree and DOES fail the job on a real
# secret hit (secrets are the one class worth a hard gate). Flip the report-only
# jobs to blocking once the baseline is triaged.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  sast:
    name: bandit (python SAST) — report-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit[toml]
      - name: Run bandit on backend/app
        continue-on-error: true
        run: |
          bandit -r backend/app \
            -x backend/app/tests,backend/tests \
            --severity-level medium \
            --confidence-level medium \
            -f screen

  dep-audit:
    name: pip-audit (dependency vulns) — report-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend/requirements.txt
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --strict || true
